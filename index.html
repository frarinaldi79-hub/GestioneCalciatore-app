<!DOCTYPE html>
<html lang="it">
<head <link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sport Pro V64.1 - Francesco Rinaldi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a; --surface: #1e293b; --accent: #38bdf8; --text-main: #f8fafc;
            --text-dim: #94a3b8; --border: #334155; --gold: #fbbf24; --danger: #ef4444;
        }
        body.light-mode {
            --bg: #f1f5f9; --surface: #ffffff; --accent: #0284c7; --text-main: #0f172a;
            --text-dim: #64748b; --border: #e2e8f0;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 800; color: var(--accent); font-size: 1.1rem; text-transform: uppercase; line-height: 1; }
        .author-tag { font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; margin-top: 4px; }

        .container { display: grid; grid-template-columns: 320px 1fr 320px; gap: 1rem; padding: 1rem; flex: 1; max-width: 1600px; margin: 0 auto; width: 100%; }
        @media (max-width: 1024px) { .container { display: flex; flex-direction: column; overflow-y: auto; } }

        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; margin-bottom: 1rem; }
        .panel-header { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; }
        .panel-body { padding: 1rem; flex: 1; }

        input, select { background: #fff !important; color: #000 !important; border: 1px solid var(--border); padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 8px; font-size: 0.9rem; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-main); margin-top: 5px; }

        /* BANNER LIBRO FIX */
        .book-promo { background: #000; border: 2px solid var(--gold); border-radius: 12px; padding: 15px; margin-top: 15px; text-align: center; }
        .book-container { width: 140px; height: 190px; margin: 0 auto 10px; overflow: hidden; border-radius: 4px; border: 1px solid var(--gold); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .book-img { width: 100%; height: 100%; object-fit: cover; }
        .buy-now { background: var(--gold); color: #000; padding: 10px; border-radius: 6px; text-decoration: none; font-size: 0.75rem; font-weight: 800; display: block; }

        /* GALLERY */
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 10px; }
        .gallery-item { position: relative; aspect-ratio: 1; border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        .del-btn { position: absolute; top: 2px; right: 2px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5; }

        #photoOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: none; align-items: center; justify-content: center; }
        #photoOverlay img { max-width: 95%; max-height: 90%; border-radius: 8px; }

        .profile-img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--accent); object-fit: cover; cursor: pointer; }
        .year-stat { background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 6px; margin-top: 4px; font-size: 0.75rem; display: flex; justify-content: space-between; }
        .hidden { display: none !important; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-box { background: var(--surface); padding: 1.5rem; border-radius: 12px; width: 90%; max-width: 350px; border: 1px solid var(--border); }
    </style>
</head>
<body>

<div id="photoOverlay" onclick="this.style.display='none'"><img id="overlayImg" src=""></div>

<header>
    <div class="logo-box">
        <div class="logo">SPORTPRO V64.1</div>
        <div class="author-tag">Creato da Francesco Rinaldi</div>
    </div>
    <button onclick="openModal('settingsModal')" style="background:none; border:none; color:var(--text-main); font-size:1.5rem; cursor:pointer;">⚙️</button>
</header>

<div id="authSection" style="max-width: 400px; margin: 2rem auto; width: 95%;">
    <div id="welcomeScreen" class="panel">
        <div class="panel-body">
            <button class="btn" onclick="setScreen('loginScreen')">Accedi al Profilo</button>
            <button class="btn btn-ghost" onclick="setScreen('masterScreen')">Crea Scheda Giocatore</button>
        </div>
    </div>
    <div id="masterScreen" class="panel hidden"><div class="panel-body">
        <input id="inputMaster" placeholder="Codice Autorizzazione">
        <button class="btn" onclick="verifyMaster()">Verifica</button>
        <button class="btn btn-ghost" onclick="setScreen('welcomeScreen')">Indietro</button>
    </div></div>
    <div id="createScreen" class="panel hidden"><div class="panel-body">
        <input id="newName" placeholder="Nome Completo">
        <input id="newTeam" placeholder="Squadra attuale">
        <input type="tel" id="newPin" placeholder="Scegli PIN (4 cifre)">
        <button class="btn" onclick="registerUser()">Salva Atleta</button>
    </div></div>
    <div id="loginScreen" class="panel hidden"><div class="panel-body">
        <input type="tel" id="loginPin" placeholder="PIN" style="text-align:center; letter-spacing:8px;">
        <button class="btn" onclick="doLogin()">Entra</button>
        <button class="btn btn-ghost" onclick="setScreen('welcomeScreen')">Indietro</button>
    </div></div>
</div>

<div id="appSection" class="container hidden">
    <div class="panel">
        <div class="panel-header">Atleta</div>
        <div class="panel-body" style="text-align:center;">
            <img id="pImg" src="https://cdn-icons-png.flaticon.com/512/1144/1144760.png" class="profile-img" onclick="document.getElementById('profileIn').click()">
            <input type="file" id="profileIn" hidden onchange="uploadProfile(event)">
            <h3 id="uiName" style="margin:10px 0 0; text-transform:uppercase;">NOME</h3>
            <p id="uiTeam" style="margin:0 0 15px; color:var(--text-dim); font-size:0.8rem;">SQUADRA</p>
            
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom: 15px;">
                <div style="background:var(--bg); padding:10px; border-radius:8px;"><span id="uiGoals" style="display:block; font-size:1.2rem; font-weight:700; color:var(--accent);">0</span><small>GOAL</small></div>
                <div style="background:var(--bg); padding:10px; border-radius:8px;"><span id="uiMatches" style="display:block; font-size:1.2rem; font-weight:700; color:var(--accent);">0</span><small>GARE</small></div>
            </div>

            <div id="yearStats" style="margin-bottom:20px; text-align:left;">
                <p style="font-size:0.65rem; color:var(--text-dim); font-weight:700; margin-bottom:5px;">STORICO ANNUALE</p>
            </div>

    <div class="panel">
        <div class="panel-header">Archivio Gare</div>
        <div class="panel-body" id="matchList" style="overflow-y:auto;"></div>
    </div>

    <div class="panel">
        <div class="panel-header">Nuovo Report</div>
        <div class="panel-body">
            <select id="mVenue">
                <option value="Casa">🏠 In Casa</option>
                <option value="Trasferta">✈️ In Trasferta</option>
            </select>
            <input id="mOp" placeholder="Avversario">
            <input id="mRes" placeholder="Risultato Team (es. 2-1)">
            <input type="number" id="mGo" placeholder="I tuoi Goal">
            <input type="date" id="mDate">
            <button class="btn" onclick="saveMatch()">Registra Partita</button>

            <div style="margin-top:20px;">
                <p style="font-size:0.65rem; font-weight:700; color:var(--text-dim);">MATCH ALBUM</p>
                <div class="gallery-grid" id="mediaPreview"></div>
                <button class="btn btn-ghost" style="font-size:0.7rem;" onclick="document.getElementById('galIn').click()">+ Aggiungi Foto</button>
                <input type="file" id="galIn" hidden onchange="uploadMedia(event)">
            </div>
        </div>
    </div>
</div>

<div id="settingsModal" class="modal" onclick="closeModal('settingsModal')">
    <div class="modal-box" onclick="event.stopPropagation()">
        <h3>Impostazioni</h3>
        <input id="changeTeamInput" placeholder="Cambia Squadra">
        <button class="btn" onclick="updateTeam()">Salva Nuova Squadra</button>
        <hr style="margin:15px 0; border:0; border-top:1px solid var(--border);">
        <button class="btn btn-ghost" onclick="toggleTheme()">🌓 Tema Chiaro/Scuro</button>
        <button class="btn btn-ghost" onclick="exportBackup()">📥 Backup Dati</button>
        <button class="btn" style="background:var(--danger); margin-top:10px;" onclick="resetAccount()">🗑️ Elimina Profilo</button>
        <button class="btn btn-ghost" style="margin-top:15px;" onclick="closeModal('settingsModal')">Annulla</button>
    </div>
</div>

<script>
    const DB_KEY = "sportpro_v64_final";
    let db = { users: [] }, currentUser = null;

    window.onload = () => {
        const data = localStorage.getItem(DB_KEY);
        if(data) db = JSON.parse(data);
        if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
    };

    function setScreen(id) {
        document.querySelectorAll('#authSection > div').forEach(d => d.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function verifyMaster() {
        if(document.getElementById('inputMaster').value === '01.01') setScreen('createScreen');
        else alert("Codice errato.");
    }

    function registerUser() {
        const n=document.getElementById('newName').value, t=document.getElementById('newTeam').value, p=document.getElementById('newPin').value;
        if(!n || !p) return alert("Nome e PIN obbligatori.");
        db.users.push({ id: Date.now(), name: n, team: t, pin: p, matches: [], media: [], profilePic: '' });
        localStorage.setItem(DB_KEY, JSON.stringify(db));
        alert("Profilo Creato!"); location.reload();
    }

    function doLogin() {
        const u = db.users.find(u=>u.pin===document.getElementById('loginPin').value);
        if(u) { currentUser=u; document.getElementById('authSection').classList.add('hidden'); document.getElementById('appSection').classList.remove('hidden'); renderUI(); }
        else alert("PIN errato.");
    }

    function saveMatch() {
        const op=document.getElementById('mOp').value, res=document.getElementById('mRes').value, go=parseInt(document.getElementById('mGo').value)||0, date=document.getElementById('mDate').value, ven=document.getElementById('mVenue').value;
        if(!op || !date) return alert("Dati mancanti");
        currentUser.matches.unshift({ id: Date.now(), op, res, go, date, ven });
        saveData(); renderUI();
        document.getElementById('mOp').value=''; document.getElementById('mRes').value=''; document.getElementById('mGo').value='';
    }

    function renderUI() {
        document.getElementById('uiName').innerText = currentUser.name.toUpperCase();
        document.getElementById('uiTeam').innerText = currentUser.team;
        if(currentUser.profilePic) document.getElementById('pImg').src = currentUser.profilePic;
        document.getElementById('uiGoals').innerText = currentUser.matches.reduce((s,m)=>s+m.go, 0);
        document.getElementById('uiMatches').innerText = currentUser.matches.length;
        
        // Storico Annuale
        const yData = {};
        currentUser.matches.forEach(m => {
            const year = new Date(m.date).getFullYear();
            if(!yData[year]) yData[year] = { g: 0, m: 0 };
            yData[year].g += m.go; yData[year].m += 1;
        });
        document.getElementById('yearStats').innerHTML = '<p style="font-size:0.65rem; color:var(--text-dim); font-weight:700; margin-bottom:5px;">STORICO ANNUALE</p>' + 
            Object.keys(yData).sort((a,b)=>b-a).map(y => `
                <div class="year-stat"><span>${y}</span><span><b>${yData[y].g} Goal</b> / ${yData[y].m} Gare</span></div>
            `).join('');

        // Lista Gare
        document.getElementById('matchList').innerHTML = currentUser.matches.map(m=>`
            <div style="background:var(--bg); padding:10px; border-radius:8px; margin-bottom:8px; border:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
                <div style="font-size:0.8rem;">
                    <span style="font-size:0.6rem; background:var(--accent); color:white; padding:1px 4px; border-radius:3px; margin-right:5px;">${m.ven}</span>
                    <b>${m.op}</b> (${m.res})<br><small>${m.date}</small>
                </div>
                <div style="color:var(--accent); font-weight:800;">+${m.go}⚽</div>
            </div>`).join('');

        // Gallery
        document.getElementById('mediaPreview').innerHTML = (currentUser.media || []).map((m, i)=>`
            <div class="gallery-item">
                <img src="${m}" onclick="openOverlay('${m}')">
                <button class="del-btn" onclick="deletePhoto(${i}, event)">×</button>
            </div>`).join('');
    }

    function updateTeam() { 
        const nt = document.getElementById('changeTeamInput').value; 
        if(nt) { currentUser.team = nt; saveData(); renderUI(); closeModal('settingsModal'); alert("Aggiornato!"); } 
    }

    function openOverlay(src) { document.getElementById('overlayImg').src = src; document.getElementById('photoOverlay').style.display='flex'; }
    function deletePhoto(idx, e) { e.stopPropagation(); if(confirm("Eliminare?")) { currentUser.media.splice(idx,1); saveData(); renderUI(); } }
    function uploadProfile(e) { const r = new FileReader(); r.onload = (ev) => { currentUser.profilePic = ev.target.result; saveData(); renderUI(); }; r.readAsDataURL(e.target.files[0]); }
    function uploadMedia(e) { const r = new FileReader(); r.onload = (ev) => { if(!currentUser.media) currentUser.media=[]; currentUser.media.unshift(ev.target.result); saveData(); renderUI(); }; r.readAsDataURL(e.target.files[0]); }
    function saveData() { const i = db.users.findIndex(u=>u.id===currentUser.id); db.users[i]=currentUser; localStorage.setItem(DB_KEY, JSON.stringify(db)); }
    function openModal(id) { document.getElementById(id).style.display='flex'; }
    function closeModal(id) { document.getElementById(id).style.display='none'; }
    function toggleTheme() { document.body.classList.toggle('light-mode'); localStorage.setItem('theme', document.body.classList.contains('light-mode')?'light':'dark'); }
    function exportBackup() { const blob = new Blob([JSON.stringify(db)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'backup.json'; a.click(); }
    function resetAccount() { if(confirm("Cancellare tutto?")) { db.users = db.users.filter(u=>u.id!==currentUser.id); localStorage.setItem(DB_KEY, JSON.stringify(db)); location.reload(); } }
</script>
